# Development-only broker configuration for the low-voltage MVP. Listeners are
# bound to explicit interfaces instead of every network adapter. The matching
# Windows Firewall rule must additionally restrict the LAN listener to the
# ESP32's current IP address. Port 1884 avoids the installer-created Mosquitto
# service, which owns localhost port 1883.
listener 1884 10.144.6.247
allow_anonymous true

persistence false
log_type error
log_type warning
log_type notice
