[platformio]
default_envs = esp32dev-relay-active-low

[env]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
board_build.partitions = partitions_mvp.csv
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=3

[env:esp32dev-relay-active-low]
build_flags =
    ${env.build_flags}
    -D RELAY_ACTIVE_LEVEL=0

[env:esp32dev-relay-active-high]
build_flags =
    ${env.build_flags}
    -D RELAY_ACTIVE_LEVEL=1
